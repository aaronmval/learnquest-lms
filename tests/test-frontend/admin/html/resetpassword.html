<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>LearnQuest | Reset Password</title>
  <link rel="icon" type="image/svg+xml" href="../images/LearnQuestLogo.svg">

  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.3/css/all.min.css">
  <link rel="stylesheet" href="../css/resetpassword.css">
</head>
<body>

  <div class="reset-container">
    <h1>Reset Password</h1>
    <p class="subtitle">Create a new password for</p>
    <p class="email-display" id="emailDisplay">your email address</p>

    <div class="error-message" id="errorMessage"></div>

    <div class="success-message" id="successMessage">
      Password reset successfully! Redirecting to login...
    </div>

    <p class="input-label">New Password</p>
    <div class="password-wrapper">
      <input type="password" id="newPassword" placeholder="Enter new password" autocomplete="new-password">
      <i class="fas fa-eye toggle-password" id="toggleNewPassword"></i>
    </div>

    <p class="input-label">Confirm Password</p>
    <div class="password-wrapper">
      <input type="password" id="confirmPassword" placeholder="Confirm new password" autocomplete="new-password">
      <i class="fas fa-eye toggle-password" id="toggleConfirmPassword"></i>
    </div>

    <ul class="password-requirements" id="passwordRequirements">
      <li id="reqLength"><i class="fas fa-circle"></i> At least 8 characters</li>
      <li id="reqUpper"><i class="fas fa-circle"></i> One uppercase letter</li>
      <li id="reqNumber"><i class="fas fa-circle"></i> One number</li>
      <li id="reqMatch"><i class="fas fa-circle"></i> Passwords match</li>
    </ul>

    <button class="btn-confirm" id="confirmBtn" disabled>
      <span id="confirmBtnText">CONFIRM</span>
      <span class="btn-spinner" id="confirmBtnSpinner"></span>
    </button>
  </div>

  <script>
    const newPasswordInput = document.getElementById('newPassword');
    const confirmPasswordInput = document.getElementById('confirmPassword');
    const toggleNewPassword = document.getElementById('toggleNewPassword');
    const toggleConfirmPassword = document.getElementById('toggleConfirmPassword');
    const confirmBtn = document.getElementById('confirmBtn');
    const confirmBtnText = document.getElementById('confirmBtnText');
    const errorMessage = document.getElementById('errorMessage');
    const successMessage = document.getElementById('successMessage');
    const emailDisplay = document.getElementById('emailDisplay');

    const reqLength = document.getElementById('reqLength');
    const reqUpper = document.getElementById('reqUpper');
    const reqNumber = document.getElementById('reqNumber');
    const reqMatch = document.getElementById('reqMatch');

    // Show the email the reset is for
    const email = sessionStorage.getItem('resetEmail') || 'your email address';
    emailDisplay.textContent = email;

    //Toggle password visibility
    function setupToggle(toggleEl, inputEl) {
      toggleEl.addEventListener('click', () => {
        const isPassword = inputEl.type === 'password';
        inputEl.type = isPassword ? 'text' : 'password';
        toggleEl.classList.toggle('fa-eye');
        toggleEl.classList.toggle('fa-eye-slash');
      });
    }
    setupToggle(toggleNewPassword, newPasswordInput);
    setupToggle(toggleConfirmPassword, confirmPasswordInput);

    //Live requirement checks
    function setReqState(el, passed) {
      el.classList.toggle('valid', passed);
      const icon = el.querySelector('i');
      icon.classList.toggle('fa-circle', !passed);
      icon.classList.toggle('fa-check-circle', passed);
    }

    function validate() {
      const pass = newPasswordInput.value;
      const confirm = confirmPasswordInput.value;

      const hasLength = pass.length >= 8;
      const hasUpper = /[A-Z]/.test(pass);
      const hasNumber = /\d/.test(pass);
      const matches = pass.length > 0 && pass === confirm;

      setReqState(reqLength, hasLength);
      setReqState(reqUpper, hasUpper);
      setReqState(reqNumber, hasNumber);
      setReqState(reqMatch, matches);

      const allValid = hasLength && hasUpper && hasNumber && matches;
      confirmBtn.disabled = !allValid;
      return allValid;
    }

    newPasswordInput.addEventListener('input', () => {
      errorMessage.classList.remove('show');
      validate();
    });
    confirmPasswordInput.addEventListener('input', () => {
      errorMessage.classList.remove('show');
      validate();
    });

    // Submit 
    function setLoading(isLoading) {
      confirmBtn.classList.toggle('loading', isLoading);
      confirmBtn.disabled = isLoading;
      confirmBtnText.style.visibility = isLoading ? 'hidden' : 'visible';
    }

    confirmBtn.addEventListener('click', () => {
      if (!validate()) return;

      setLoading(true);
      errorMessage.classList.remove('show');

      setTimeout(() => {
        const success = true; 

        if (success) {
          setLoading(false);
          successMessage.classList.add('show');
          newPasswordInput.disabled = true;
          confirmPasswordInput.disabled = true;
          confirmBtn.disabled = true;
          sessionStorage.removeItem('resetEmail');

          setTimeout(() => {
            window.location.href = '../html/login.html';
          }, 2000);
        } else {
          setLoading(false);
          errorMessage.textContent = 'Something went wrong. Please try again.';
          errorMessage.classList.add('show');
        }
      }, 700);
    });
  </script>

</body>
</html>
