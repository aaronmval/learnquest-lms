<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <script src="../../assets/js/common/frame-guard.js"></script>
        <script src="../../assets/js/common/page-transitions.js" defer></script>
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>LearnQuest | My Class</title>
        <link
            rel="icon"
            type="image/svg+xml"
            href="../../../assets/images/LearnQuestLogo.svg"
        />

        <link
            rel="stylesheet"
            href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"
        />
        <link
            href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap"
            rel="stylesheet"
        />

        <link rel="stylesheet" href="../../assets/css/base/components.css" />
        <link
            rel="stylesheet"
            href="../../assets/css/pages/student/enrolled-class.css"
        />
    </head>
    <body>
        <main id="mainContent">
            <!-- CLASS NOT FOUND / NOT ENROLLED STATE -->
            <div id="classNotFound" class="class-not-found hidden">
                <i class="fas fa-circle-exclamation"></i>
                <h1>Class not found</h1>
                <p>
                    This class doesn't exist, or you're not enrolled in it.
                </p>
                <a href="student-home.html" class="hero-btn">
                    <i class="fas fa-arrow-left"></i> Back to Home
                </a>
            </div>

            <div id="classroomWrap" class="classroom-wrap">
                <!-- CLASS HEADER BANNER -->
                <section id="classBanner" class="class-banner">
                    <div class="class-banner-text">
                        <h1
                            id="classBannerSubject"
                            class="class-banner-subject"
                        ></h1>
                        <p id="classBannerSection" class="class-banner-section"></p>
                        <p id="classBannerTeacher" class="class-banner-teacher"></p>
                        <p class="class-banner-role">Teacher</p>
                        <button
                            type="button"
                            class="hero-tour-btn"
                            data-tour-start
                        >
                            <i class="fas fa-route"></i> Take the tour
                        </button>
                    </div>
                    <div id="classBannerMastery" class="class-banner-mastery hidden">
                        <span id="classBannerMasteryValue" class="class-banner-mastery-value">—</span>
                        <span id="classBannerMasteryLabel" class="class-banner-mastery-label">Average Mastery</span>
                    </div>
                    <i class="fas fa-book-open class-banner-icon"></i>
                </section>

                <!-- TWO COLUMN: FEED + SIDE PANEL -->
                <div class="classroom-grid">
                    <!-- LEFT: Announcement / Lesson feed -->
                    <div id="feedColumn" class="feed-column"></div>

                    <!-- RIGHT: AI tools panel -->
                    <div class="side-column">
                        <div class="ai-panel">
                            <button id="summarizeBtn" class="summarize-btn" disabled>
                                <span class="bot-icon"><i class="fas fa-robot"></i></span>
                                Summarize class note
                            </button>
                        </div>

                        <div class="ai-insights-card">
                            <div class="ai-insights-header">
                                <span class="ai-insights-icon"><i class="fas fa-cloud"></i></span>
                                <span class="ai-insights-title">AI Insights for You</span>
                            </div>
                            <div id="insightsList">
                                <div class="insight-item insight-status">
                                    <i class="fas fa-spinner fa-spin"></i> Analyzing your mastery...
                                </div>
                            </div>
                            <button id="insightsRefreshBtn" class="insight-refresh">
                                <i class="fas fa-rotate"></i> Refresh insights
                            </button>
                        </div>
                    </div>
                </div>
            </div>
        </main>

        <!-- PDF MODAL -->
        <div
            id="pdfModal"
            aria-modal="true"
            role="dialog"
            aria-labelledby="pdfModalTitle"
        >
            <div id="pdfModalBackdrop" class="pdf-modal-backdrop"></div>
            <div class="pdf-modal-card">
                <div class="pdf-modal-header">
                    <div class="pdf-modal-header-left">
                        <span class="pdf-modal-file-icon">
                            <i class="fas fa-file-pdf"></i>
                        </span>
                        <span id="pdfModalTitle" class="pdf-modal-title"
                            >Lesson.pdf</span
                        >
                    </div>
                    <div class="pdf-modal-header-right">
                        <a
                            id="pdfModalDownload"
                            class="pdf-modal-action-btn pdf-modal-download"
                            href="#"
                            title="Download PDF"
                            aria-label="Download PDF"
                        >
                            <i class="fas fa-download"></i>
                            <span>Download</span>
                        </a>
                        <button
                            id="pdfModalClose"
                            class="pdf-modal-action-btn pdf-modal-close"
                            aria-label="Close PDF viewer"
                        >
                            <i class="fas fa-times"></i>
                        </button>
                    </div>
                </div>
                <div class="pdf-modal-body">
                    <iframe
                        id="pdfModalViewer"
                        class="pdf-modal-iframe pdf-viewer-initial-hidden"
                        title="PDF viewer"
                        frameborder="0"
                    ></iframe>
                    <div id="pdfModalPlaceholder" class="pdf-modal-placeholder">
                        <div class="pdf-placeholder-inner">
                            <i class="fas fa-file-pdf pdf-placeholder-icon"></i>
                            <p class="pdf-placeholder-title">
                                PDF preview not available
                            </p>
                            <p class="pdf-placeholder-sub">
                                This file requires a direct download.
                            </p>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <script src="../../assets/js/common/class-post-card.js"></script>
        <script src="../../assets/js/common/insights-card.js"></script>
        <script src="../../assets/js/common/guided-tour.js"></script>
        <script src="../../assets/js/common/page-tour.js"></script>
        <script src="../../assets/js/pages/student/enrolled-class.js"></script>
    </body>
</html>
