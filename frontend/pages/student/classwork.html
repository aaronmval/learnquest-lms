<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <script src="../../assets/js/common/frame-guard.js"></script>
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>LearnQuest | Classwork</title>
        <link
            rel="icon"
            type="image/svg+xml"
            href="../../../assets/images/LearnQuestLogo.svg"
        />

        <link
            rel="stylesheet"
            href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"
        />
        <link
            href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap"
            rel="stylesheet"
        />

        <link rel="stylesheet" href="../../assets/css/base/components.css" />
        <link
            rel="stylesheet"
            href="../../assets/css/pages/student/classwork.css"
        />
    </head>
    <body>
        <main id="mainContent">
            <!-- CLASS / LESSON NOT FOUND STATE -->
            <div id="classNotFound" class="class-not-found hidden">
                <i class="fas fa-circle-exclamation"></i>
                <h1 id="classNotFoundTitle">Class not found</h1>
                <p id="classNotFoundMessage">
                    This class doesn't exist, or you're not enrolled in it.
                </p>
                <a id="classNotFoundLink" href="student-home.html" class="hero-btn">
                    <i class="fas fa-arrow-left"></i> Back to Home
                </a>
            </div>

            <div id="classroomWrap" class="classroom-wrap">
                <!-- CLASS HEADER BANNER -->
                <section id="classBanner" class="class-banner">
                    <div class="class-banner-text">
                        <h1
                            id="classBannerSubject"
                            class="class-banner-subject"
                        ></h1>
                        <p id="classBannerSection" class="class-banner-section"></p>
                        <p id="classBannerTeacher" class="class-banner-teacher"></p>
                        <p class="class-banner-role">Teacher</p>
                    </div>
                    <div id="classBannerMastery" class="class-banner-mastery hidden">
                        <span id="classBannerMasteryValue" class="class-banner-mastery-value">—</span>
                        <span id="classBannerMasteryLabel" class="class-banner-mastery-label">Lesson Mastery</span>
                    </div>
                    <i class="fas fa-book-open class-banner-icon"></i>
                </section>

                <!-- BACK BUTTON -->
                <button
                    id="backToClassBtn"
                    class="back-to-class-btn"
                    type="button"
                >
                    <i class="fas fa-arrow-left"></i>
                    <span>Back to Class</span>
                </button>

                <!-- TWO COLUMN: LESSON DETAIL + SIDE PANEL -->
                <div class="classroom-grid">
                    <!-- LEFT: Single lesson card + Summary of Lesson -->
                    <div class="lesson-detail-column">
                        <div id="feedColumn" class="feed-column"></div>

                        <div class="summary-card">
                            <div class="summary-card-header">
                                <span class="summary-card-title"
                                    >Summary of Lesson</span
                                >
                                <span class="summary-card-icon"
                                    ><i class="fas fa-robot"></i
                                ></span>
                            </div>
                            <div
                                id="summaryResult"
                                class="summary-result"
                            ></div>
                        </div>
                    </div>

                    <!-- RIGHT: Quiz card -->
                    <div class="side-column">
                        <div class="quiz-card">
                            <div class="quiz-card-header">
                                <span id="quizCardTitle" class="quiz-card-title"
                                    >Quiz</span
                                >
                                <span class="quiz-card-icon"
                                    ><i class="fas fa-brain"></i
                                ></span>
                            </div>
                            <button id="takeQuizBtn" class="take-quiz-btn">
                                Take Quiz
                            </button>
                        </div>
                    </div>
                </div>
            </div>
        </main>

        <!-- PDF MODAL -->
        <div
            id="pdfModal"
            aria-modal="true"
            role="dialog"
            aria-labelledby="pdfModalTitle"
        >
            <div id="pdfModalBackdrop" class="pdf-modal-backdrop"></div>
            <div class="pdf-modal-card">
                <div class="pdf-modal-header">
                    <div class="pdf-modal-header-left">
                        <span class="pdf-modal-file-icon">
                            <i class="fas fa-file-pdf"></i>
                        </span>
                        <span id="pdfModalTitle" class="pdf-modal-title"
                            >Lesson.pdf</span
                        >
                    </div>
                    <div class="pdf-modal-header-right">
                        <a
                            id="pdfModalDownload"
                            class="pdf-modal-action-btn pdf-modal-download"
                            href="#"
                            title="Download PDF"
                            aria-label="Download PDF"
                        >
                            <i class="fas fa-download"></i>
                            <span>Download</span>
                        </a>
                        <button
                            id="pdfModalClose"
                            class="pdf-modal-action-btn pdf-modal-close"
                            aria-label="Close PDF viewer"
                        >
                            <i class="fas fa-times"></i>
                        </button>
                    </div>
                </div>
                <div class="pdf-modal-body">
                    <iframe
                        id="pdfModalViewer"
                        class="pdf-modal-iframe pdf-viewer-initial-hidden"
                        title="PDF viewer"
                        frameborder="0"
                    ></iframe>
                    <div id="pdfModalPlaceholder" class="pdf-modal-placeholder">
                        <div class="pdf-placeholder-inner">
                            <i class="fas fa-file-pdf pdf-placeholder-icon"></i>
                            <p class="pdf-placeholder-title">
                                PDF preview not available
                            </p>
                            <p class="pdf-placeholder-sub">
                                This file requires a direct download.
                            </p>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <script src="../../assets/js/common/class-post-card.js"></script>
        <script src="../../assets/js/pages/student/classwork.js"></script>
    </body>
</html>
