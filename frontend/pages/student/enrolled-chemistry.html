<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>LearnQuest | Chemistry</title>
        <link
            rel="icon"
            type="image/svg+xml"
            href="../../../assets/images/LearnQuestLogo.svg"
        />

        <!-- Icons & Font -->
        <link
            rel="stylesheet"
            href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"
        />
        <link
            href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap"
            rel="stylesheet"
        />

        <!-- Shared navigation styles -->
        <link rel="stylesheet" href="../../assets/css/base/components.css" />

        <!-- Shared enrolled classroom styles -->
        <link
            rel="stylesheet"
            href="../../assets/css/pages/student/enrolled-chemistry.css"
        />
    </head>
    <body>
        <main id="mainContent">
            <div class="classroom-wrap">
                <!-- CLASS HEADER BANNER -->
                <section id="classBanner" class="class-banner">
                    <div class="class-banner-text">
                        <h1
                            id="classBannerSubject"
                            class="class-banner-subject"
                        >
                            CHEMISTRY
                        </h1>
                        <p id="classBannerSection" class="class-banner-section">
                            STEM - AMETHYST
                        </p>
                        <p id="classBannerTeacher" class="class-banner-teacher">
                            Mila D. Valiente
                        </p>
                        <p class="class-banner-role">Teacher</p>
                        <p
                            id="classBannerMastery"
                            class="class-banner-mastery"
                        ></p>
                    </div>
                    <i class="fas fa-book-open class-banner-icon"></i>
                </section>

                <!-- TWO COLUMN: FEED + SIDE PANEL -->
                <div class="classroom-grid">
                    <!-- LEFT: Announcement / Lesson feed -->
                    <div id="feedColumn" class="feed-column">
                        <!-- Populated dynamically by enrolledchemistry.js -->
                    </div>

                    <!-- RIGHT: AI tools panel -->
                    <div class="side-column">
                        <div class="ai-panel">
                            <button id="summarizeBtn" class="summarize-btn">
                                <span class="bot-icon"
                                    ><i class="fas fa-robot"></i
                                ></span>
                                Summarize class note
                            </button>
                            <div id="summaryResult" class="hidden"></div>
                        </div>

                        <div class="ai-insights-card">
                            <div class="ai-insights-header">
                                <span class="ai-insights-icon"
                                    ><i class="fas fa-cloud"></i
                                ></span>
                                <span class="ai-insights-title"
                                    >AI Insights for You</span
                                >
                            </div>
                            <div id="insightsList"></div>
                            <button
                                id="insightsRefreshBtn"
                                class="insight-refresh"
                            >
                                <i class="fas fa-rotate"></i> Refresh insights
                            </button>
                        </div>
                    </div>
                </div>
            </div>
        </main>
        <script src="../../assets/js/pages/student/enrolled-chemistry.js"></script>
    </body>
</html>
