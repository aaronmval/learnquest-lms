<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <script src="../../assets/js/common/frame-guard.js"></script>
        <script src="../../assets/js/common/page-transitions.js" defer></script>
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>LearnQuest | Homepage</title>
        <link
            rel="icon"
            type="image/svg+xml"
            href="../../../assets/images/LearnQuestLogo.svg"
        />

        <!-- Icons & Font -->
        <link
            rel="stylesheet"
            href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"
        />
        <link
            href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap"
            rel="stylesheet"
        />

        <!-- Shared navigation styles -->
        <link rel="stylesheet" href="../../assets/css/base/components.css" />

        <!-- This page's own styles -->
        <link
            rel="stylesheet"
            href="../../assets/css/pages/student/student-home.css"
        />
    </head>
    <body>
        <main id="mainContent">
            <!-- HERO BANNER -->
            <section class="hero-banner">
                <div class="hero-text">
                    <h1 class="hero-title">
                        Welcome to your Portal Hub
                        <span id="heroName"></span>
                    </h1>
                    <p class="hero-subtitle">
                        Stay sharp, track assignments, use simulated
                        experimental modules.
                    </p>
                    <div class="hero-actions">
                        <a href="student-quest-ai.html" class="hero-btn">
                            <i class="fas fa-robot"></i> Launch QuestAI Coach
                        </a>
                        <button
                            type="button"
                            class="hero-tour-btn"
                            data-tour-start
                        >
                            <i class="fas fa-route"></i> Take the tour
                        </button>
                    </div>
                </div>
                <div class="hero-illustration">
                    <i class="fas fa-school"></i>
                </div>
            </section>

            <!-- ENROLLED CLASSES SECTION -->
            <section class="enrolled-section">
                <div class="enrolled-heading">
                    <h2 class="enrolled-title">Enrolled Classes</h2>
                    <p class="enrolled-subtitle">
                        Access your digital rooms and learning resources
                    </p>
                </div>

                <!-- CLASS CARDS GRID — rendered by student-home.js from the database -->
                <div class="class-grid" id="classGrid"></div>
                <!-- End of class grid -->
            </section>
        </main>
        <script src="../../assets/js/common/guided-tour.js"></script>
        <script src="../../assets/js/common/page-tour.js"></script>
        <script src="../../assets/js/pages/student/student-home.js"></script>
    </body>
</html>
