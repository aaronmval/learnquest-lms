<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>LearnQuest | Forgot Password</title>
    <link rel="icon" type="image/svg+xml" href="../../assets/images/LearnQuestLogo.svg">

  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.3/css/all.min.css">
  <link rel="stylesheet" href="../../assets/css/pages/auth/forgot-password.css">
</head>
<body>

  <div class="forgot-password-container">
    <h1>Forgot Password</h1>
    <p class="subtitle">You will receive an email with one-time password</p>

    <div class="success-message" id="successMessage">
      <i class="fas fa-check-circle"></i> Email sent successfully! Please check your inbox.
    </div>

    <form id="forgotPasswordForm">
      <label class="input-label">Enter your Email Address</label>
      
      <div class="input-wrapper">
        <i class="fas fa-envelope input-icon"></i>
        <input type="email" id="emailInput" placeholder="EMAIL ADDRESS" required>
      </div>

      <button type="submit" class="btn-next">NEXT</button>

      <a href="../pages/loginpage.html" class="back-link" onclick="history.back(); return false;">
        <i class="fas fa-arrow-left"></i> Back to Login
      </a>
    </form>
  </div>

  <script>
    const form = document.getElementById('forgotPasswordForm');
    const emailInput = document.getElementById('emailInput');
    const successMessage = document.getElementById('successMessage');

    form.addEventListener('submit', (e) => {
      e.preventDefault();
      
      const email = emailInput.value;

      if (email) {
        // Store email in sessionStorage to pass to next pages
        sessionStorage.setItem('resetEmail', email);
        
        // Show success message
        successMessage.classList.add('show');
        
        // In a real application, you would send the email via API here
        console.log('Password reset OTP sent to:', email);

        // Redirect to OTP verification page after 2 seconds
        setTimeout(() => {
          window.location.href = 'otp-verification.html';
        }, 2000);
      }
    });
  </script>

</body>
</html>
