<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>LearnQuest | Professor Dashboard</title>
        <link
            rel="icon"
            type="image/svg+xml"
            href="../../../assets/images/LearnQuestLogo.svg"
        />

        <link
            rel="stylesheet"
            href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"
        />
        <link
            href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap"
            rel="stylesheet"
        />

        <link rel="stylesheet" href="../../assets/css/base/components.css" />
        <link
            rel="stylesheet"
            href="../../assets/css/pages/professor/professor-dashboard.css"
        />

        <script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
    </head>
    <body>
        <main id="mainContent">
                <!-- HERO BANNER -->
                <section class="hero-banner">
                    <div class="hero-text">
                        <h1 class="hero-title">Professor Dashboard</h1>
                        <p class="hero-subtitle">
                            Comprehensive Monitoring Graphs Management Overview
                        </p>
                        <a href="professor-quest-ai.html" class="hero-btn">
                            <i class="fas fa-robot"></i> Launch QuestAI Coach
                        </a>
                    </div>
                    <div class="hero-illustration">
                        <i class="fas fa-magnifying-glass-chart"></i>
                    </div>
                </section>

                <!-- FILTER RECORDS -->
                <section class="filter-section">
                    <h2 class="filter-title">Filter Records</h2>
                    <div class="filter-controls">
                        <div class="filter-group">
                            <label class="filter-label" for="startDate">
                                Date Range — (Start and End)
                            </label>
                            <div class="date-inputs">
                                <input
                                    type="date"
                                    id="startDate"
                                    class="filter-input"
                                />
                                <input
                                    type="date"
                                    id="endDate"
                                    class="filter-input"
                                />
                            </div>
                        </div>

                        <div class="filter-group">
                            <label class="filter-label" for="sectionSelect">
                                Section
                            </label>
                            <select
                                id="sectionSelect"
                                class="filter-input filter-select"
                            >
                                <option value="">All Sections</option>
                                <option value="amethyst">
                                    STEM - Amethyst
                                </option>
                                <option value="sapphire">
                                    STEM - Sapphire
                                </option>
                                <option value="topaz">STEM - Topaz</option>
                            </select>
                        </div>

                        <div class="filter-group">
                            <label class="filter-label" for="quarterSelect">
                                Quarter (1<sup>st</sup> to 4<sup>th</sup>)
                            </label>
                            <select
                                id="quarterSelect"
                                class="filter-input filter-select"
                            >
                                <option value="">All Quarters</option>
                                <option value="1">1st Quarter</option>
                                <option value="2">2nd Quarter</option>
                                <option value="3">3rd Quarter</option>
                                <option value="4">4th Quarter</option>
                            </select>
                        </div>

                        <div class="filter-actions">
                            <button
                                id="exportBtn"
                                class="filter-btn filter-btn-export"
                            >
                                <i class="fas fa-arrow-up-from-bracket"></i>
                                Export
                            </button>
                            <button
                                id="resetBtn"
                                class="filter-btn filter-btn-reset"
                            >
                                <i class="fas fa-rotate-right"></i> Reset
                            </button>
                        </div>
                    </div>
                </section>

                <!-- CHARTS GRID -->
                <section class="charts-grid">
                    <div class="chart-card">
                        <div class="chart-header">
                            <h3 class="chart-title">
                                Class Performance Overview
                            </h3>
                            <span
                                class="active-filter-badge"
                                id="performanceBadge"
                                style="display: none"
                            >
                                <i class="fas fa-filter"></i>
                                <span id="performanceBadgeText"></span>
                            </span>
                            <span class="chart-header-icon"
                                ><i class="fas fa-chart-line"></i
                            ></span>
                        </div>
                        <div class="chart-canvas-wrap">
                            <canvas id="performanceChart"></canvas>
                        </div>
                    </div>

                    <div class="chart-card">
                        <div class="chart-header">
                            <h3 class="chart-title">Radar Chart</h3>
                            <span
                                class="active-filter-badge"
                                id="radarBadge"
                                style="display: none"
                            >
                                <i class="fas fa-filter"></i>
                                <span id="radarBadgeText"></span>
                            </span>
                            <span class="chart-header-icon"
                                ><i class="fas fa-chart-area"></i
                            ></span>
                        </div>
                        <div class="chart-canvas-wrap">
                            <canvas id="radarChart"></canvas>
                        </div>
                    </div>

                    <div class="chart-card insights-card">
                        <div class="chart-header">
                            <h3 class="chart-title">
                                AI Insights and Recommendation
                            </h3>
                            <span
                                class="active-filter-badge"
                                id="insightsBadge"
                                style="display: none"
                            >
                                <i class="fas fa-filter"></i>
                                <span id="insightsBadgeText"></span>
                            </span>
                            <span class="chart-header-icon"
                                ><i class="fas fa-brain"></i
                            ></span>
                        </div>
                        <div class="insights-list" id="insightsList">
                            <!-- Insight items injected by JS -->
                        </div>
                    </div>

                    <div class="chart-card mastery-card">
                        <div class="chart-header">
                            <h3 class="chart-title">
                                Average Mastery per Lesson
                            </h3>
                            <span
                                class="active-filter-badge"
                                id="masteryBadge"
                                style="display: none"
                            >
                                <i class="fas fa-filter"></i>
                                <span id="masteryBadgeText"></span>
                            </span>
                            <span class="chart-header-icon"
                                ><i class="fas fa-graduation-cap"></i
                            ></span>
                        </div>
                        <div class="mastery-grid" id="masteryGrid">
                            <!-- Mastery boxes injected by JS -->
                        </div>
                    </div>
                </section>
            </main>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
    <script src="../../assets/js/pages/professor/professor-dashboard.js"></script>
    </body>
</html>
