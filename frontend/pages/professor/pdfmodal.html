<div id="pdfModal" aria-modal="true" role="dialog" aria-labelledby="pdfModalTitle">

    <!-- Semi-transparent backdrop -->
    <div id="pdfModalBackdrop" class="pdf-modal-backdrop"></div>

    <!-- Modal card -->
    <div class="pdf-modal-card">

        <!-- Header -->
        <div class="pdf-modal-header">
            <div class="pdf-modal-header-left">
                <span class="pdf-modal-file-icon">
                    <i class="fas fa-file-pdf"></i>
                </span>
                <span id="pdfModalTitle" class="pdf-modal-title">Lesson.pdf</span>
            </div>
            <div class="pdf-modal-header-right">
                <a id="pdfModalDownload"
                   class="pdf-modal-action-btn pdf-modal-download"
                   href="#"
                   title="Download PDF"
                   aria-label="Download PDF">
                    <i class="fas fa-download"></i>
                    <span>Download</span>
                </a>
                <button id="pdfModalClose"
                        class="pdf-modal-action-btn pdf-modal-close"
                        aria-label="Close PDF viewer">
                    <i class="fas fa-times"></i>
                </button>
            </div>
        </div>

        <!-- Viewer area -->
        <div class="pdf-modal-body">

            <!-- Real PDF iframe  -->
            <iframe id="pdfModalViewer"
                    class="pdf-modal-iframe"
                    title="PDF viewer"
                    style="display:none;"
                    frameborder="0">
            </iframe>

            <!-- Placeholder -->
            <div id="pdfModalPlaceholder" class="pdf-modal-placeholder">
                <div class="pdf-placeholder-inner">
                    <i class="fas fa-file-pdf pdf-placeholder-icon"></i>
                    <p class="pdf-placeholder-title">PDF preview not available</p>
                    <p class="pdf-placeholder-sub">
                        The teacher hasn't uploaded this file yet, or it requires a direct download.
                    </p>
                </div>
            </div>

        </div>
    </div>
</div>
