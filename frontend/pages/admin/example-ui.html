<!DOCTYPE html>
<html lang="en" class="scroll-smooth h-screen overflow-hidden">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LearnQuest - Interactive Workspace Portal</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        brand: {
                            50: '#f0f7ff',
                            100: '#e0effe',
                            800: '#1e40af',
                            900: '#1e3a8a',
                            darkBg: '#0f172a',
                            darkPanel: '#1e293b'
                        }
                    }
                }
            }
        }
    </script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; -webkit-font-smoothing: antialiased; }
        .smooth-transition { transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1); }
        .courses-dropdown {
            transition: max-height 0.35s cubic-bezier(0.4, 0, 0.2, 1), opacity 0.25s ease;
            max-height: 0; opacity: 0; overflow: hidden;
        }
        .courses-dropdown.open { opacity: 1; }
        .nav-active { background-color: #1e3a8a !important; color: #ffffff !important; border-left: 4px solid #3b82f6; }
        .dark .nav-active { background-color: #334155 !important; color: #38bdf8 !important; border-left: 4px solid #38bdf8; }
        .flip-card { perspective: 1000px; }
        .flip-card-inner { transition: transform 0.6s cubic-bezier(0.4, 0, 0.2, 1); transform-style: preserve-3d; }
        .flip-card.flipped .flip-card-inner { transform: rotateY(180deg); }
        .flip-card-front, .flip-card-back { backface-visibility: hidden; position: absolute; inset: 0; }
        .flip-card-back { transform: rotateY(180deg); }
        @media (min-width: 768px) {
            .sidebar-collapsed { width: 4.5rem !important; }
            .sidebar-collapsed .sidebar-text { display: none !important; }
            .sidebar-collapsed .chevron-icon { display: none !important; }
            .sidebar-collapsed .sidebar-link { justify-content: center; padding-left: 0 !important; padding-right: 0 !important; }
            .sidebar-collapsed .courses-dropdown { max-height: 0 !important; opacity: 0 !important; }
        }
        /* Markdown-like rendering for AI responses */
        .ai-message h1, .ai-message h2, .ai-message h3 { font-weight: 700; margin: 0.5rem 0 0.25rem; }
        .ai-message h1 { font-size: 1rem; }
        .ai-message h2 { font-size: 0.9rem; }
        .ai-message h3 { font-size: 0.85rem; }
        .ai-message p { margin: 0.25rem 0; }
        .ai-message strong { font-weight: 700; }
        .ai-message em { font-style: italic; }
        .ai-message ul, .ai-message ol { padding-left: 1.2rem; margin: 0.25rem 0; }
        .ai-message li { margin: 0.1rem 0; }
        .ai-message code { background: rgba(0,0,0,0.08); padding: 1px 4px; border-radius: 3px; font-family: monospace; font-size: 0.85em; }
        .dark .ai-message code { background: rgba(255,255,255,0.12); }
        .ai-message pre { background: rgba(0,0,0,0.08); padding: 0.5rem; border-radius: 6px; overflow-x: auto; margin: 0.3rem 0; }
        .dark .ai-message pre { background: rgba(255,255,255,0.08); }
        .ai-message pre code { background: none; padding: 0; }
    </style>
</head>
<body class="bg-slate-50 text-slate-800 dark:bg-[#0f172a] dark:text-slate-100 h-screen flex flex-col overflow-hidden relative smooth-transition">

    <header class="bg-[#182c44] dark:bg-[#090d16] text-white h-16 px-4 md:px-6 flex items-center justify-between shadow-md z-30 shrink-0 border-b border-slate-800/80">
        <div class="flex items-center gap-3">
            <button id="mobileSidebarToggle" class="p-2 rounded-full hover:bg-[#243b56] transition-colors focus:outline-none md:hidden">
                <i class="fas fa-bars text-lg"></i>
            </button>
            <button id="desktopSidebarToggle" class="p-2 rounded-full hover:bg-[#243b56] transition-colors focus:outline-none hidden md:inline-block">
                <i class="fas fa-bars text-lg"></i>
            </button>
            <div class="flex items-center gap-2 select-none mr-2">
                <div class="bg-white text-[#182c44] p-1.5 rounded-lg font-bold flex items-center justify-center shadow-inner">
                    <i class="fas fa-graduation-cap text-lg"></i>
                </div>
                <span class="text-xl font-bold tracking-tight hidden sm:inline-block">LearnQuest</span>
            </div>
        </div>

        <div class="flex-1 max-w-xl mx-4 hidden md:flex items-center text-sm font-medium text-slate-300 select-none">
            <span id="breadcrumb-parent" class="hover:text-white transition-colors cursor-pointer" onclick="switchTab('dashboard')">Main</span>
            <i class="fas fa-chevron-right text-xs mx-2.5 text-slate-500"></i>
            <span id="breadcrumb-child" class="text-white font-semibold">Dashboard</span>
        </div>

        <div class="flex items-center gap-2 sm:gap-3">
            <button onclick="toggleDarkMode()" class="p-2 rounded-full hover:bg-[#243b56] transition-colors focus:outline-none pl-3" title="Toggle Dark/Light Mode">
                <i id="darkModeIcon" class="fas fa-moon"></i>
            </button>
            <button id="notiBtn" class="relative p-2 rounded-full hover:bg-[#243b56] transition-colors focus:outline-none" onclick="toggleNotifications()">
                <i class="fas fa-bell"></i>
                <span id="notiBadge" class="absolute top-1 right-1 w-2.5 h-2.5 bg-red-500 rounded-full"></span>
            </button>
            <div class="flex items-center gap-3 border-l border-slate-700/60 pl-3 select-none">
                <div id="headerAvatar" class="w-9 h-9 rounded-full bg-blue-500 shadow-inner shrink-0 flex items-center justify-center font-bold text-white uppercase text-sm">A</div>
                <div class="text-left hidden lg:block">
                    <div id="headerProfileName" class="text-sm font-bold text-white tracking-wide leading-tight">Welcome, Aaron!</div>
                    <div id="headerProfileRole" class="text-xs text-slate-400 font-medium leading-none mt-0.5">Student</div>
                </div>
            </div>
        </div>
    </header>

    <div class="flex flex-1 overflow-hidden relative">
        <!-- Sidebar removed; injected canonical component will be used -->
            <nav class="flex-1 py-4 overflow-y-auto space-y-1">
                <button onclick="switchTab('home')" id="nav-home" class="sidebar-link smooth-transition w-full flex items-center gap-4 px-5 py-3 text-sm font-medium hover:bg-[#243b56] dark:hover:bg-slate-800 text-slate-300">
                    <i class="fas fa-home text-lg w-5 text-center shrink-0"></i>
                    <span class="sidebar-text">Home Hub</span>
                </button>
                <button onclick="switchTab('dashboard')" id="nav-dashboard" class="sidebar-link smooth-transition w-full flex items-center gap-4 px-5 py-3 text-sm font-medium hover:bg-[#243b56] dark:hover:bg-slate-800 text-slate-300 nav-active">
                    <i class="fas fa-th-large text-lg w-5 text-center shrink-0"></i>
                    <span class="sidebar-text">Dashboard</span>
                </button>
                <div>
                    <button onclick="toggleCoursesDropdown()" class="sidebar-link w-full flex items-center justify-between px-5 py-3 text-sm font-medium transition-colors hover:bg-[#243b56] dark:hover:bg-slate-800 text-slate-300 focus:outline-none">
                        <div class="flex items-center gap-4">
                            <i class="fas fa-graduation-cap text-lg w-5 text-center shrink-0"></i>
                            <span class="sidebar-text">Labs</span>
                        </div>
                        <i id="chevron-icon" class="fas fa-chevron-down text-xs smooth-transition chevron-icon"></i>
                    </button>
                    <div id="courses-dropdown-container" class="courses-dropdown pl-4 space-y-0.5 bg-[#122235] dark:bg-[#0b101b]">
                        <button onclick="switchTab('chemistry')" id="nav-chemistry" class="sidebar-link smooth-transition w-full flex items-center gap-3 px-5 py-2 text-xs font-medium hover:bg-[#243b56] text-slate-300">
                            <span class="w-3.5 h-3.5 rounded-full bg-cyan-400 block shrink-0"></span>
                            <span class="sidebar-text truncate">Chemistry Lab</span>
                        </button>
                        <button onclick="switchTab('mathematics')" id="nav-mathematics" class="sidebar-link smooth-transition w-full flex items-center gap-3 px-5 py-2 text-xs font-medium hover:bg-[#243b56] text-slate-300">
                            <span class="w-3.5 h-3.5 rounded-full bg-orange-500 block shrink-0"></span>
                            <span class="sidebar-text truncate">Math Workspace</span>
                        </button>
                        <button onclick="switchTab('physics')" id="nav-physics" class="sidebar-link smooth-transition w-full flex items-center gap-3 px-5 py-2 text-xs font-medium hover:bg-[#243b56] text-slate-300">
                            <span class="w-3.5 h-3.5 rounded-full bg-purple-500 block shrink-0"></span>
                            <span class="sidebar-text truncate">Physics Sim</span>
                        </button>
                        <button onclick="switchTab('english')" id="nav-english" class="sidebar-link smooth-transition w-full flex items-center gap-3 px-5 py-2 text-xs font-medium hover:bg-[#243b56] text-slate-300">
                            <span class="w-3.5 h-3.5 rounded-full bg-green-500 block shrink-0"></span>
                            <span class="sidebar-text truncate">English Essay</span>
                        </button>
                        <button onclick="switchTab('history')" id="nav-history" class="sidebar-link smooth-transition w-full flex items-center gap-3 px-5 py-2 text-xs font-medium hover:bg-[#243b56] text-slate-300">
                            <span class="w-3.5 h-3.5 rounded-full bg-amber-500 block shrink-0"></span>
                            <span class="sidebar-text truncate">History Logs</span>
                        </button>
                    </div>
                </div>
                <button onclick="switchTab('assignments')" id="nav-assignments" class="sidebar-link smooth-transition w-full flex items-center gap-4 px-5 py-3 text-sm font-medium hover:bg-[#243b56] text-slate-300">
                    <i class="fas fa-file-alt text-lg w-5 text-center shrink-0"></i>
                    <span class="sidebar-text">Worksheets</span>
                </button>
                <button onclick="switchTab('questai')" id="nav-questai" class="sidebar-link smooth-transition w-full flex items-center gap-4 px-5 py-3 text-sm font-medium hover:bg-[#243b56] text-slate-300">
                    <i class="fas fa-brain text-lg w-5 text-center text-indigo-400 shrink-0"></i>
                    <span class="sidebar-text font-semibold text-indigo-300">QuestAI Coach</span>
                </button>
            </nav>
            <div class="border-t border-slate-700/50 p-2 bg-[#122235] dark:bg-[#090e18] space-y-1 shrink-0">
                <button onclick="switchTab('settings')" id="nav-settings" class="sidebar-link smooth-transition w-full flex items-center gap-4 px-5 py-3 text-sm font-medium hover:bg-[#243b56] text-slate-300 rounded-xl">
                    <i class="fas fa-cog text-lg w-5 text-center shrink-0"></i>
                    <span class="sidebar-text">Settings</span>
                </button>
                <button onclick="openLogoutModal()" class="sidebar-link smooth-transition w-full flex items-center gap-4 px-5 py-3 text-sm font-medium hover:bg-red-900/40 text-red-400 hover:text-red-200 rounded-xl">
                    <i class="fas fa-sign-out-alt text-lg w-5 text-center shrink-0"></i>
                    <span class="sidebar-text">Sign Out</span>
                </button>
            </div>
        </aside>

        <main class="flex-1 overflow-y-auto p-4 md:p-6 bg-slate-50 dark:bg-slate-900 smooth-transition" id="mainContent">
            <div class="max-w-6xl mx-auto space-y-6" id="dynamicContainer"></div>
        </main>
    </div>

    <!-- Notification Drawer -->
    <div id="notiDrawer" class="fixed right-0 top-16 bottom-0 w-80 bg-white dark:bg-slate-800 shadow-2xl border-l border-slate-200 dark:border-slate-700 z-40 transform translate-x-full transition-transform duration-300 ease-in-out">
        <div class="p-4 border-b border-slate-200 dark:border-slate-700 flex justify-between items-center bg-slate-50 dark:bg-slate-900">
            <h3 class="font-bold text-slate-900 dark:text-white flex items-center gap-2">
                <i class="fas fa-bell text-blue-600"></i> System Alerts
            </h3>
            <button onclick="clearNotifications()" class="text-xs text-blue-600 hover:underline">Clear all</button>
        </div>
        <div id="notiList" class="p-3 overflow-y-auto space-y-2 max-h-[calc(100vh-140px)]"></div>
    </div>

    <div id="sidebarOverlay" class="fixed inset-0 bg-slate-950/40 z-10 hidden transition-opacity duration-300 md:hidden"></div>

    <!-- Logout Modal -->
    <div id="logoutModal" class="fixed inset-0 z-50 flex items-center justify-center p-4 bg-slate-950/60 backdrop-blur-sm hidden opacity-0 transition-all duration-300">
        <div class="bg-white dark:bg-slate-800 rounded-2xl max-w-sm w-full p-6 shadow-2xl border border-slate-100 dark:border-slate-700 transform scale-90 transition-all duration-300" id="logoutModalCard">
            <div class="text-center">
                <div class="w-12 h-12 rounded-full bg-red-100 dark:bg-red-950/60 text-red-600 dark:text-red-400 flex items-center justify-center mx-auto mb-4">
                    <i class="fas fa-sign-out-alt text-xl"></i>
                </div>
                <h3 class="text-lg font-bold text-slate-900 dark:text-white">Sign Out</h3>
                <p class="text-sm text-slate-500 dark:text-slate-400 mt-2 leading-relaxed">Are you sure you want to exit your workspace session?</p>
            </div>
            <div class="mt-6 flex items-center gap-3">
                <button onclick="closeLogoutModal()" class="flex-1 py-2.5 px-4 bg-slate-100 dark:bg-slate-700 hover:bg-slate-200 dark:hover:bg-slate-600 transition-colors text-slate-700 dark:text-slate-200 text-sm font-semibold rounded-xl">Cancel</button>
                <button onclick="confirmLogout()" class="flex-1 py-2.5 px-4 bg-red-600 hover:bg-red-700 transition-colors text-white text-sm font-semibold rounded-xl shadow-sm">Confirm</button>
            </div>
        </div>
    </div>

    <!-- Reset Modal -->
    <div id="resetModal" class="fixed inset-0 z-50 flex items-center justify-center p-4 bg-slate-950/60 backdrop-blur-sm hidden opacity-0 transition-all duration-300">
        <div class="bg-white dark:bg-slate-800 rounded-2xl max-w-sm w-full p-6 shadow-2xl border border-slate-100 dark:border-slate-700 transform scale-90 transition-all duration-300" id="resetModalCard">
            <div class="text-center">
                <div class="w-12 h-12 rounded-full bg-amber-100 dark:bg-amber-950/60 text-amber-600 dark:text-amber-400 flex items-center justify-center mx-auto mb-4">
                    <i class="fas fa-exclamation-triangle text-xl"></i>
                </div>
                <h3 class="text-lg font-bold text-slate-900 dark:text-white">Reset Workspace Data</h3>
                <p class="text-sm text-slate-500 dark:text-slate-400 mt-2 leading-relaxed">This will permanently delete all assignment status history and customizable profile changes. Proceed?</p>
            </div>
            <div class="mt-6 flex items-center gap-3">
                <button onclick="closeResetModal()" class="flex-1 py-2.5 px-4 bg-slate-100 dark:bg-slate-700 hover:bg-slate-200 dark:hover:bg-slate-600 transition-colors text-slate-700 dark:text-slate-200 text-sm font-semibold rounded-xl">Cancel</button>
                <button onclick="confirmReset()" class="flex-1 py-2.5 px-4 bg-amber-600 hover:bg-amber-700 transition-colors text-white text-sm font-semibold rounded-xl shadow-sm">Reset</button>
            </div>
        </div>
    </div>

    <!-- Toast -->
    <div id="toast" class="fixed bottom-5 right-5 bg-slate-900/95 dark:bg-slate-800 text-white border border-slate-700 px-4 py-3 rounded-xl shadow-2xl flex items-center gap-3 transform translate-y-20 opacity-0 transition-all duration-300 z-50 pointer-events-none">
        <div class="bg-blue-600/20 p-1.5 rounded-lg text-blue-400"><i class="fas fa-info-circle"></i></div>
        <span id="toastMessage" class="text-sm font-medium"></span>
    </div>

<script>
// ===================== STATE =====================
let state = {
    user: { name: "Aaron", role: "Undergraduate Student", themeColor: "blue", streakDays: 4 },
    notifications: [
        { id: 1, text: "Welcome back, Aaron! Today's lesson is Classical Mechanics in physics.", time: "Just Now", read: false },
        { id: 2, text: "Chemistry assignment 'Covalent Bonding quiz' has been posted.", time: "2h ago", read: false },
        { id: 3, text: "Streak achievement unlocked: 4 Days Active!", time: "1d ago", read: true }
    ],
    assignments: [
        { id: "chem-1", course: "chemistry", title: "Covalent & Ionic Bonding Analysis", status: "pending", dueDate: "Tomorrow", score: null, answer: "" },
        { id: "math-1", course: "mathematics", title: "Dynamic Calculus Problem Set", status: "pending", dueDate: "3 days left", score: null, answer: "" },
        { id: "phys-1", course: "physics", title: "Projectile Trajectory Calculation Quiz", status: "graded", dueDate: "Completed", score: "95/100", answer: "Launched dynamic trajectory targets." },
        { id: "eng-1", course: "english", title: "Comparative Essay on Transcendentalism", status: "pending", dueDate: "5 days left", score: null, answer: "" }
    ],
    flashcards: {
        chemistry: [
            { q: "What is an ionic bond?", a: "A chemical bond formed through the electrostatic attraction of oppositely charged ions." },
            { q: "What is the formula of Hydrogen Peroxide?", a: "H2O2" },
            { q: "Which element has atomic number 1?", a: "Hydrogen" }
        ],
        mathematics: [
            { q: "What is the derivative of sin(x)?", a: "cos(x)" },
            { q: "Solve: x^2 - 9 = 0", a: "x = 3 or x = -3" },
            { q: "What is Euler's constant approximately?", a: "e ≈ 2.718" }
        ],
        physics: [
            { q: "State Newton's Second Law", a: "Force is equal to mass multiplied by acceleration (F = ma)." },
            { q: "What is the acceleration due to gravity on Moon?", a: "Approximately 1.62 m/s²." }
        ]
    },
    currentCardIdx: 0,
    chatHistory: [
        { sender: "ai", text: "Hello! I am your QuestAI Assistant. You can ask me to outline essays, solve dynamic math formulas, explain chemical properties, or test your logic." }
    ],
    chemLab: { slot1: "", slot2: "" },
    physicsSim: { angle: 45, velocity: 45, gravity: 9.8, targetDist: 150, score: 0 }
};

// UI globals
const sidebar = document.getElementById('sidebar');
const sidebarOverlay = document.getElementById('sidebarOverlay');
const logoutModal = document.getElementById('logoutModal');
const logoutModalCard = document.getElementById('logoutModalCard');
const resetModal = document.getElementById('resetModal');
const resetModalCard = document.getElementById('resetModalCard');
const notiDrawer = document.getElementById('notiDrawer');
const notiBadge = document.getElementById('notiBadge');
let currentTab = "dashboard";
let canvas, ctx, isLaunching = false, projX, projY, projVX, projVY, animationFrameId;
let selectedAssignmentId = null;

// ===================== INIT =====================
window.addEventListener('DOMContentLoaded', () => {
    if (localStorage.getItem('learnquest_state')) {
        try { state = JSON.parse(localStorage.getItem('learnquest_state')); } catch(e) {}
    }
    if (localStorage.getItem('darkMode') === 'true') {
        document.documentElement.classList.add('dark');
        document.getElementById('darkModeIcon').className = "fas fa-sun";
    }
    renderProfile();
    renderNotifications();
    renderDynamicTabContent();

    document.getElementById('mobileSidebarToggle').addEventListener('click', () => {
        sidebar.classList.remove('-translate-x-full');
        sidebarOverlay.classList.remove('hidden');
    });
    sidebarOverlay.addEventListener('click', () => {
        sidebar.classList.add('-translate-x-full');
        sidebarOverlay.classList.add('hidden');
    });
    document.getElementById('desktopSidebarToggle').addEventListener('click', () => {
        sidebar.classList.toggle('sidebar-collapsed');
    });
});

function saveState() {
    localStorage.setItem('learnquest_state', JSON.stringify(state));
}

// ===================== PROFILE =====================
function renderProfile() {
    document.getElementById('headerProfileName').textContent = `Welcome, ${state.user.name}!`;
    document.getElementById('headerProfileRole').textContent = state.user.role;
    const initials = state.user.name.split(' ').map(n => n[0]).join('').substring(0, 2);
    document.getElementById('headerAvatar').textContent = initials;
}

// ===================== NOTIFICATIONS =====================
function toggleNotifications() {
    notiDrawer.classList.toggle('translate-x-full');
}

function renderNotifications() {
    const notiList = document.getElementById('notiList');
    const unreadCount = state.notifications.filter(n => !n.read).length;
    notiBadge.classList.toggle('hidden', unreadCount === 0);
    notiList.innerHTML = '';
    if (state.notifications.length === 0) {
        notiList.innerHTML = `<div class="text-center py-8 text-slate-400 text-sm">No new alerts.</div>`;
        return;
    }
    state.notifications.forEach(n => {
        notiList.innerHTML += `
            <div class="p-3 rounded-lg ${n.read ? 'bg-slate-100/50 dark:bg-slate-700/30' : 'bg-blue-50 dark:bg-slate-700 border-l-4 border-blue-500'} text-xs relative">
                <p class="text-slate-800 dark:text-slate-200 font-medium">${n.text}</p>
                <span class="text-[10px] text-slate-400 block mt-1">${n.time}</span>
                ${!n.read ? `<button onclick="markRead(${n.id})" class="absolute right-2 top-2 text-blue-500 hover:text-blue-700 text-[10px] uppercase font-bold">Read</button>` : ''}
            </div>`;
    });
}

function markRead(id) {
    state.notifications = state.notifications.map(n => n.id === id ? {...n, read: true} : n);
    saveState(); renderNotifications();
}

function clearNotifications() {
    state.notifications = [];
    saveState(); renderNotifications();
    showNotification("Cleared all notifications");
}

// ===================== TOAST =====================
function showNotification(text) {
    const toast = document.getElementById('toast');
    document.getElementById('toastMessage').textContent = text;
    toast.classList.replace('translate-y-20', 'translate-y-0');
    toast.classList.replace('opacity-0', 'opacity-100');
    setTimeout(() => {
        toast.classList.replace('translate-y-0', 'translate-y-20');
        toast.classList.replace('opacity-100', 'opacity-0');
    }, 2500);
}

// ===================== NAV =====================
function toggleCoursesDropdown() {
    sidebar.classList.remove('sidebar-collapsed');
    const container = document.getElementById('courses-dropdown-container');
    const icon = document.getElementById('chevron-icon');
    if (container.classList.contains('open')) {
        container.style.maxHeight = "0px";
        container.classList.remove('open');
        icon.classList.remove('rotate-180');
    } else {
        container.style.maxHeight = container.scrollHeight + "px";
        container.classList.add('open');
        icon.classList.add('rotate-180');
    }
}

function switchTab(tabId) {
    currentTab = tabId;
    const parentBC = document.getElementById('breadcrumb-parent');
    const childBC = document.getElementById('breadcrumb-child');
    if (['chemistry','mathematics','physics','english','history'].includes(tabId)) {
        parentBC.textContent = "Courses";
    } else { parentBC.textContent = "Main"; }
    childBC.textContent = tabId.charAt(0).toUpperCase() + tabId.slice(1);
    document.querySelectorAll('.sidebar-link').forEach(btn => btn.classList.remove('nav-active'));
    const activeBtn = document.getElementById(`nav-${tabId}`);
    if (activeBtn) activeBtn.classList.add('nav-active');
    sidebar.classList.add('-translate-x-full');
    sidebarOverlay.classList.add('hidden');
    renderDynamicTabContent();
}

function renderDynamicTabContent() {
    const container = document.getElementById('dynamicContainer');
    state.currentCardIdx = state.currentCardIdx || 0;
    const map = {
        home: getHomeHTML, dashboard: getDashboardHTML, chemistry: getChemistryHTML,
        mathematics: getMathematicsHTML, physics: getPhysicsHTML, english: getEnglishHTML,
        history: getHistoryHTML, assignments: getAssignmentsHTML, questai: getQuestAIHTML,
        settings: getSettingsHTML
    };
    container.innerHTML = (map[currentTab] || getDashboardHTML)();

function selectChemical(element) {
    if (!state.chemLab.slot1) {
        state.chemLab.slot1 = element;
        document.getElementById('beakerStatus').innerHTML = `Slot 1: <strong class="text-cyan-500">${element}</strong>. Select next element.`;
    } else if (!state.chemLab.slot2) {
        state.chemLab.slot2 = element;
        document.getElementById('beakerStatus').innerHTML = `Slot 1: <strong class="text-cyan-500">${state.chemLab.slot1}</strong> + Slot 2: <strong class="text-cyan-500">${element}</strong>.`;
    } else {
        showNotification("Beaker full! Clear the vessel to try another mix.");
    }
}

function clearChemistryLab() {
    state.chemLab.slot1 = ""; state.chemLab.slot2 = "";
    const vessel = document.getElementById('chemVessel');
    vessel.innerHTML = `<div class="text-6xl mb-2 text-slate-400"><i class="fas fa-prescription-bottle-alt"></i></div><span id="beakerStatus" class="text-xs font-bold text-slate-500">Beaker is currently empty</span>`;
}

function triggerSynthesis() {
    const s1 = state.chemLab.slot1, s2 = state.chemLab.slot2;
    const vessel = document.getElementById('chemVessel');
    if (!s1 || !s2) { showNotification("Select both elements first!"); return; }
    let product = `${s1}${s2} Mix`, desc = "Inert mixture. No direct ionic or covalent coupling calculated at standard temperatures.", icon = "fa-vials", color = "text-yellow-500";
    if ((s1==='H'&&s2==='O')||(s1==='O'&&s2==='H')) { product="H₂O (Water)"; desc="Hydrogen pairs covalently with oxygen forming a clean, stable fluid layer."; icon="fa-tint"; color="text-blue-500"; }
    else if ((s1==='Na'&&s2==='Cl')||(s1==='Cl'&&s2==='Na')) { product="NaCl (Table Salt)"; desc="Exothermic ionic reaction forms crystalline sodium chloride grids."; icon="fa-dice-d6"; color="text-amber-500"; }
    vessel.className = "text-center transition-all duration-300 scale-110 rotate-6";
    setTimeout(() => {
        vessel.className = "text-center transition-all duration-300 scale-100";
        vessel.innerHTML = `<div class="text-6xl ${color} mb-2 animate-bounce"><i class="fas ${icon}"></i></div><span class="text-xs font-black block">${product}</span><p class="text-[10px] text-slate-500 mt-1 max-w-xs mx-auto">${desc}</p>`;
    }, 500);
    showNotification(`Synthesized product: ${product}`);
}

function flipFlashcard() {
    document.getElementById('flashcardBox').classList.toggle('flipped');
}

function prevFlashcard(subject) {
    const cards = state.flashcards[subject];

function nextFlashcard(subject) {
    const cards = state.flashcards[subject];
    state.currentCardIdx = (state.currentCardIdx + 1) % cards.length;
    renderDynamicTabContent();
}

function gradeMathQuiz(isCorrect) {
    const resultBox = document.getElementById('mathQuizResult');

        resultBox.innerHTML = "Correct! Using power rules, 3x² derivatives to 6x, and 5x to 5.";
    } else {
        resultBox.className = "p-3 rounded-xl text-xs font-bold bg-red-100 dark:bg-red-950/40 text-red-700 dark:text-red-400";
        resultBox.innerHTML = "Incorrect. Try applying the standard formula: d/dx(x^n) = n*x^(n-1).";
    }
}

function solveExpression() {
    const input = document.getElementById('mathInput').value.trim();
    const box = document.getElementById('mathSolverBox');
    box.classList.remove('hidden');
    if (input === "x^2 - 4") {
        box.innerHTML = `<p class="font-bold text-slate-900 dark:text-white">Expression: (x - 2)(x + 2) = 0</p><p class="text-orange-500 mt-1 font-bold">Calculated Roots: x = 2, -2</p>`;
    } else {
        box.innerHTML = `<p class="text-slate-500">Equation factored. Launch QuestAI Coach to see step-by-step calculus graphs.</p>`;
    }
}

                            <button onclick="resetPhysicsTarget()" class="py-2.5 px-3 bg-slate-100 dark:bg-slate-700 hover:bg-slate-200 dark:hover:bg-slate-600 text-xs rounded-xl font-bold text-slate-700 dark:text-slate-200">Reset Target</button>
                        </div>
                    </div>
                </div>
                <div class="bg-white dark:bg-slate-800 p-6 rounded-2xl border border-slate-200 dark:border-slate-700 shadow-sm lg:col-span-2 space-y-4 overflow-hidden">
                    <div class="flex justify-between items-center">
                        <h3 class="font-bold text-slate-900 dark:text-white text-md"><i class="fas fa-satellite-dish text-purple-500"></i> Vector Graph</h3>
                        <div class="text-xs bg-purple-100 dark:bg-purple-950/60 text-purple-700 dark:text-purple-400 px-3 py-1 rounded-full font-bold">
                            Score: <span id="targetScore">${state.physicsSim.score}</span>
                        </div>
                    </div>
                    <div class="bg-slate-900 rounded-xl overflow-hidden relative">
                        <canvas id="physicsCanvas" class="w-full h-64 block"></canvas>
                    </div>
                </div>
            </div>
        </div>`;
}

function initPhysicsCanvas() {
    canvas = document.getElementById('physicsCanvas');
    if (!canvas) return;
    ctx = canvas.getContext('2d');
    canvas.width = canvas.parentElement.clientWidth;
    canvas.height = 256;
    drawStaticScene();
}

function drawStaticScene() {
    if (!ctx) return;
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    ctx.fillStyle = "#334155";
    ctx.fillRect(0, canvas.height - 16, canvas.width, 16);
    ctx.fillStyle = "#a855f7";
    ctx.beginPath();
    ctx.arc(30, canvas.height - 16, 20, Math.PI, 0);
    ctx.fill();
    const rad = (state.physicsSim.angle * Math.PI) / 180;
    const vectorLen = state.physicsSim.velocity * 1.2;
    const tx = 30 + Math.cos(rad) * vectorLen;
    const ty = (canvas.height - 16) - Math.sin(rad) * vectorLen;
    ctx.strokeStyle = "#c084fc"; ctx.lineWidth = 2; ctx.setLineDash([4, 4]);
    ctx.beginPath(); ctx.moveTo(30, canvas.height - 16); ctx.lineTo(tx, ty); ctx.stroke();
    ctx.setLineDash([]);
    ctx.fillStyle = "#ef4444";
    ctx.fillRect(state.physicsSim.targetDist, canvas.height - 16, 25, 6);
}

function updatePhysicsValues() {
    state.physicsSim.angle = parseFloat(document.getElementById('angleRange').value);
    state.physicsSim.velocity = parseFloat(document.getElementById('velocityRange').value);
    state.physicsSim.gravity = parseFloat(document.getElementById('gravitySelect').value);
    document.getElementById('angleVal').textContent = `${state.physicsSim.angle}°`;
    document.getElementById('velocityVal').textContent = `${state.physicsSim.velocity} m/s`;
    drawStaticScene();
}

function launchProjectile() {
    if (isLaunching) return;
    isLaunching = true;
    projX = 30; projY = canvas.height - 16;
    const rad = (state.physicsSim.angle * Math.PI) / 180;
    projVX = Math.cos(rad) * (state.physicsSim.velocity * 0.15);
    projVY = -Math.sin(rad) * (state.physicsSim.velocity * 0.15);
    cancelAnimationFrame(animationFrameId);
    runSimulationLoop();
}

function runSimulationLoop() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    drawStaticScene();
    projVY += (state.physicsSim.gravity * 0.015);
    projX += projVX; projY += projVY;
    ctx.fillStyle = "#facc15";
    ctx.beginPath(); ctx.arc(projX, projY, 6, 0, Math.PI * 2); ctx.fill();
    if (projY >= canvas.height - 16) {
        isLaunching = false;
        if (projX >= state.physicsSim.targetDist && projX <= state.physicsSim.targetDist + 25) {
            state.physicsSim.score++;
            const scoreEl = document.getElementById('targetScore');
            if (scoreEl) scoreEl.textContent = state.physicsSim.score;
            showNotification("Target destroyed! +100pts!");
        } else { showNotification("Missed! Adjust launch angle."); }
        saveState(); drawStaticScene(); return;
    }
    if (projX > canvas.width) { isLaunching = false; showNotification("Flew out of bounds."); drawStaticScene(); return; }
    animationFrameId = requestAnimationFrame(runSimulationLoop);
}

function resetPhysicsTarget() {
    if (canvas) state.physicsSim.targetDist = Math.floor(Math.random() * (canvas.width - 150)) + 100;
    saveState(); drawStaticScene();
    showNotification("Target repositioned.");
}

// Simple markdown renderer
function escapeHtml(str) {
    return str.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

function renderMarkdown(text) {
    let html = escapeHtml(text);
    // Code blocks
    html = html.replace(/```[\w]*\n?([\s\S]*?)```/g, '<pre><code>$1</code></pre>');
    // Inline code
    html = html.replace(/`([^`]+)`/g, '<code>$1</code>');
    // Bold
    html = html.replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>');
    html = html.replace(/__([^_]+)__/g, '<strong>$1</strong>');
    // Italic
    html = html.replace(/\*([^*]+)\*/g, '<em>$1</em>');
    html = html.replace(/_([^_]+)_/g, '<em>$1</em>');
    // Headers
    html = html.replace(/^### (.+)$/gm, '<h3>$1</h3>');
    html = html.replace(/^## (.+)$/gm, '<h2>$1</h2>');
    html = html.replace(/^# (.+)$/gm, '<h1>$1</h1>');
    // Lists
    html = html.replace(/^\* (.+)$/gm, '<li>$1</li>');
    html = html.replace(/^- (.+)$/gm, '<li>$1</li>');
    html = html.replace(/^\d+\. (.+)$/gm, '<li>$1</li>');
    // Wrap consecutive <li> items
    html = html.replace(/(<li>.*<\/li>\n?)+/g, match => `<ul>${match}</ul>`);
    // Paragraphs — wrap lines not already in a block tag
    html = html.split('\n').map(line => {
        if (!line.trim()) return '';
        if (line.match(/^<(h[1-3]|ul|li|pre|p)/)) return line;
        return `<p>${line}</p>`;
    }).join('');
    return html;
}

// Claude Anthropic API call
async function callClaudeAPI(userQuery) {
    const response = await fetch("https://api.anthropic.com/v1/messages", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({
            model: "claude-sonnet-4-6",
            max_tokens: 1000,
            system: "You are QuestAI, an extremely helpful and rigorous academic tutor for a student learning portal called LearnQuest. Answer the student's question clearly, use markdown formatting, and explain complex concepts intuitively. Keep answers focused and educational.",
            messages: [{ role: "user", content: userQuery }]
        })
    });
    if (!response.ok) throw new Error(`API error: ${response.status}`);
    const data = await response.json();
    return data.content?.[0]?.text || "I couldn't generate a response. Please try again.";
}

async function sendChatMessage() {
    const queryBox = document.getElementById('aiChatQuery');
    const query = queryBox.value.trim();
    if (!query) return;
    state.chatHistory.push({ sender: "user", text: query });
    queryBox.value = "";
    renderDynamicTabContent();
    scrollToBottomChat();

    const chatBox = document.getElementById('aiChatScroll');
    if (chatBox) {
        const waitBubble = document.createElement('div');
        waitBubble.id = 'ai-waiting-bubble';
        waitBubble.className = 'flex gap-3 justify-start animate-pulse';
        waitBubble.innerHTML = `<div class="max-w-[80%] rounded-2xl p-3 bg-slate-100 dark:bg-slate-900 text-slate-400 italic text-xs">QuestAI Coach is computing variables...</div>`;
        chatBox.appendChild(waitBubble);
        chatBox.scrollTop = chatBox.scrollHeight;
    }

    try {
        const aiResponse = await callClaudeAPI(query);
        state.chatHistory.push({ sender: "ai", text: aiResponse });
    } catch (error) {
        const fallback = `Let's study! Your question about "${query}" is a great one. I'm having trouble connecting right now — please try again in a moment.`;
        state.chatHistory.push({ sender: "ai", text: fallback });
    }

    saveState();
    renderDynamicTabContent();
    scrollToBottomChat();
}

function scrollToBottomChat() {
    setTimeout(() => {
        const chatBox = document.getElementById('aiChatScroll');
        if (chatBox) chatBox.scrollTop = chatBox.scrollHeight;
    }, 50);
}
